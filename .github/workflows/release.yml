name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}. Bump package.json before tagging."
            exit 1
          fi
          echo "Releasing ${PKG}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Publish GitHub release
        id: publish
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Summary
        run: |
          {
            echo "### Released ${GITHUB_REF_NAME}"
            echo ""
            echo "- Release: ${{ steps.publish.outputs.url }}"
            echo "- Asset: \`qoder-cn-copilot-provider-$(node -p "require('./package.json').version").vsix\`"
          } >> "$GITHUB_STEP_SUMMARY"